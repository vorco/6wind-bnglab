# Copy to vars/secrets.yml (gitignored) and fill in. Never commit the real file.
# Optionally encrypt it: ansible-vault encrypt vars/secrets.yml (then run make with VAULT=1).

# 6WIND licence serial, activated online by the VSR on first boot.
vsr_license_serial: "CHANGE-ME"

# Admin account created on the VSR by cloud-init; used for NETCONF and SSH.
vsr_admin_user: "lab-admin"
vsr_admin_password: "CHANGE-ME"

# Public keys allowed to log in to the VSR and the generator.
lab_ssh_public_keys:
  - "ssh-ed25519 AAAA... you@workstation"

# Shared secret between the VSR and FreeRADIUS (authentication and accounting).
radius_shared_secret: "CHANGE-ME"
# Shared secret for Change-of-Authorization and Disconnect messages sent to the VSR.
radius_coa_secret: "CHANGE-ME"
