# Copy inventory/example to inventory/local (gitignored) and edit it for your lab.
# The lab runs on exactly one Proxmox VE host, in the "pve" group.
all:
  children:
    pve:
      hosts:
        lab-pve:
          ansible_host: 192.0.2.10
          ansible_user: root
  vars:
    ansible_python_interpreter: /usr/bin/python3
