# Configures the VSR's access side (fast path, LAG, subscriber VRF, PPPoE and IPoE servers),
# refreshes RADIUS, and proves it by bringing every lab subscriber up with BNG Blaster.
# Run after make generator.
- name: Check the lab inventory
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - lab_inventory
  tasks:
    - name: Add the VSR and the generator to this run's inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: ["{{ item.group }}"]
        ansible_host: "{{ item.ip }}"
        ansible_user: "{{ item.user }}"
        ansible_password: "{{ item.password | default(omit) }}"
        ansible_connection: "{{ item.connection }}"
        ansible_network_os: "{{ item.network_os | default(omit) }}"
        ansible_port: "{{ item.port }}"
        ansible_ssh_private_key_file: "{{ hostvars[groups['pve'][0]].ansible_ssh_private_key_file | default(omit) }}"
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_python_interpreter: /usr/bin/python3
      loop:
        - {name: bnglab-vsr, group: lab_vsr, ip: "{{ lab_mgmt.vsr_ip }}", user: "{{ vsr_admin_user }}",
           password: "{{ vsr_admin_password }}", connection: ansible.netcommon.netconf, network_os: default, port: 830}
        - {name: bnglab-gen, group: lab_gen, ip: "{{ lab_mgmt.gen_ip }}", user: lab, connection: ssh, port: 22}
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      no_log: true

- name: Refresh RADIUS
  hosts: pve
  gather_facts: false
  pre_tasks:
    - name: Load the secrets
      ansible.builtin.include_vars:
        file: "{{ lab_secrets_file }}"
      no_log: true
  roles:
    - lab_radius

- name: Configure the VSR access side
  hosts: lab_vsr
  gather_facts: false
  pre_tasks:
    - name: Load the secrets
      ansible.builtin.include_vars:
        file: "{{ lab_secrets_file }}"
      no_log: true
  roles:
    - role: lab_vsr
      vars:
        lab_vsr_parts: [fast_path, interfaces, ppp_server, ipoe_server]

- name: Bring the subscribers up
  hosts: lab_gen
  gather_facts: false
  roles:
    - lab_sessions
