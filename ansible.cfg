[defaults]
# The inventory is passed by the Makefile (INVENTORY ?= inventory/local).
host_key_checking = False
retry_files_enabled = False
timeout = 60
callback_result_format = yaml
interpreter_python = auto_silent
collections_path = ./collections
roles_path = ./roles
filter_plugins = ./filter_plugins

[ssh_connection]
# Retry a dropped SSH connection rather than failing the run
retries = 3
pipelining = True

[persistent_connection]
# NETCONF to the VSR. A controller reaching the lab over a VPN or WAN can see slow or
# failed connection setups, and a VSR commit can take a while, so allow generous time.
connect_timeout = 120
connect_retry_timeout = 60
command_timeout = 120
